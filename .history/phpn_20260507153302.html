<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Game Mancing Ikan</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      overflow:hidden;
      background: linear-gradient(to top, #87ceeb 0%, #bdefff 45%, #2f9fe8 45%, #1d6fb8 100%);
      height:100vh;
    }

    /* LANGIT */
    .sun{
      position:absolute;
      top:40px;
      right:60px;
      width:100px;
      height:100px;
      background:#ffd93d;
      border-radius:50%;
      box-shadow:0 0 40px #ffd93d;
    }

    .cloud{
      position:absolute;
      width:140px;
      height:60px;
      background:white;
      border-radius:50px;
      opacity:0.9;
    }

    .cloud::before,
    .cloud::after{
      content:'';
      position:absolute;
      background:white;
      border-radius:50%;
    }

    .cloud::before{
      width:70px;
      height:70px;
      top:-30px;
      left:20px;
    }

    .cloud::after{
      width:80px;
      height:80px;
      top:-40px;
      right:15px;
    }

    .cloud1{
      top:80px;
      left:80px;
      animation:cloudMove 25s linear infinite;
    }

    .cloud2{
      top:160px;
      left:400px;
      transform:scale(0.8);
      animation:cloudMove 30s linear infinite;
    }

    @keyframes cloudMove{
      from{
        transform:translateX(-200px);
      }
      to{
        transform:translateX(140vw);
      }
    }

    /* DARAT */
    .ground{
      position:absolute;
      top:40%;
      left:0;
      width:100%;
      height:80px;
      background:#3ea93e;
      border-top-left-radius:50px;
      border-top-right-radius:50px;
    }

    /* AIR */
    .water{
      position:absolute;
      bottom:0;
      width:100%;
      height:55%;
      background:
      repeating-linear-gradient(
        -45deg,
        rgba(255,255,255,0.08),
        rgba(255,255,255,0.08) 10px,
        transparent 10px,
        transparent 20px
      ),
      linear-gradient(to bottom, #2f9fe8, #155d9b);
      overflow:hidden;
    }

    .wave{
      position:absolute;
      width:200%;
      height:100px;
      top:-30px;
      left:-50%;
      background:rgba(255,255,255,0.15);
      border-radius:40%;
      animation:wave 6s linear infinite;
    }

    @keyframes wave{
      from{
        transform:translateX(0);
      }
      to{
        transform:translateX(200px);
      }
    }

    /* ORANG */
    .person{
      position:absolute;
      left:220px;
      top:210px;
      z-index:5;
    }

    .head{
      width:45px;
      height:45px;
      background:#ffd1a4;
      border-radius:50%;
      margin-left:25px;
    }

    .body{
      width:70px;
      height:90px;
      background:#ff4d4d;
      border-radius:20px;
      margin-top:-5px;
    }

    .arm{
      position:absolute;
      width:70px;
      height:12px;
      background:#ffd1a4;
      top:60px;
      left:55px;
      transform:rotate(-18deg);
      transform-origin:left center;
      border-radius:20px;
    }

    .leg1,
    .leg2{
      position:absolute;
      width:14px;
      height:70px;
      background:#222;
      top:120px;
      border-radius:20px;
    }

    .leg1{
      left:18px;
      transform:rotate(8deg);
    }

    .leg2{
      left:45px;
      transform:rotate(-8deg);
    }

    /* PANCING */
    .rod{
      position:absolute;
      width:170px;
      height:6px;
      background:#6b3d18;
      top:55px;
      left:110px;
      transform:rotate(15deg);
      transform-origin:left center;
      border-radius:10px;
    }

    .line{
      position:absolute;
      width:2px;
      height:180px;
      background:white;
      top:70px;
      left:260px;
    }

    .hook{
      position:absolute;
      width:16px;
      height:16px;
      border:3px solid silver;
      border-top:none;
      border-left:none;
      border-radius:0 0 50% 50%;
      top:245px;
      left:252px;
      transform:rotate(40deg);
    }

    /* IKAN */
    .fish{
      position:absolute;
      width:90px;
      height:45px;
      background:orange;
      border-radius:50px;
      cursor:pointer;
      animation:swim 3s linear forwards;
      box-shadow:0 0 15px rgba(0,0,0,0.2);
      transition:0.2s;
    }

    .fish:hover{
      transform:scale(1.1);
    }

    .fish::before{
      content:'';
      position:absolute;
      right:-20px;
      top:8px;
      border-left:22px solid orange;
      border-top:14px solid transparent;
      border-bottom:14px solid transparent;
    }

    .fish::after{
      content:'';
      position:absolute;
      left:12px;
      top:12px;
      width:8px;
      height:8px;
      background:black;
      border-radius:50%;
    }

    @keyframes swim{
      from{
        transform:translateX(100vw);
      }
      to{
        transform:translateX(-200px);
      }
    }

    /* POPUP */
    .popup{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.6);
      display:flex;
      align-items:center;
      justify-content:center;
      opacity:0;
      pointer-events:none;
      transition:0.3s;
      z-index:999;
    }

    .popup.show{
      opacity:1;
      pointer-events:auto;
    }

    .popup-box{
      width:320px;
      background:white;
      border-radius:25px;
      padding:30px;
      text-align:center;
      animation:pop 0.3s ease;
    }

    @keyframes pop{
      from{
        transform:scale(0.5);
      }
      to{
        transform:scale(1);
      }
    }

    .popup-box h1{
      color:#ff7b00;
      margin-bottom:10px;
      font-size:32px;
    }

    .popup-box p{
      font-size:18px;
      color:#444;
      margin-bottom:20px;
    }

    .popup-box button{
      padding:12px 25px;
      border:none;
      background:#2f9fe8;
      color:white;
      border-radius:15px;
      cursor:pointer;
      font-size:16px;
    }

    .popup-box button:hover{
      background:#1872b7;
    }

  </style>
</head>
<body>

  <div class="sun"></div>

  <div class="cloud cloud1"></div>
  <div class="cloud cloud2"></div>

  <div class="ground"></div>

  <!-- ORANG MANCING -->
  <div class="person">
    <div class="head"></div>
    <div class="body"></div>
    <div class="arm"></div>
    <div class="leg1"></div>
    <div class="leg2"></div>
  </div>

  <div class="rod"></div>
  <div class="line"></div>
  <div class="hook"></div>

  <!-- AIR -->
  <div class="water" id="water">
    <div class="wave"></div>
  </div>

  <!-- POPUP -->
  <div class="popup" id="popup">
    <div class="popup-box">
      <h1>🐟 Ikan!</h1>
      <p>Kamu berhasil menangkap ikan!</p>
      <button onclick="closePopup()">Tutup</button>
    </div>
  </div>

  <script>
    const water = document.getElementById("water");
    const popup = document.getElementById("popup");

    // Buat ikan tiap 2 detik
    setInterval(createFish, 2000);

    function createFish() {
      const fish = document.createElement("div");
      fish.classList.add("fish");

      // Posisi random
      const top = Math.random() * 250 + 80;
      fish.style.top = top + "px";

      // Warna random
      const colors = [
        "#ff9800",
        "#ff4d4d",
        "#ffd93d",
        "#8e44ad",
        "#00c2ff",
        "#2ecc71"
      ];

      const randomColor =
        colors[Math.floor(Math.random() * colors.length)];

      fish.style.background = randomColor;

      fish.addEventListener("click", () => {
        popup.classList.add("show");
        fish.remove();
      });

      water.appendChild(fish);

      // Hapus setelah selesai berenang
      setTimeout(() => {
        fish.remove();
      }, 5000);
    }

    function closePopup() {
      popup.classList.remove("show");
    }
  </script>

</body>
</html>
