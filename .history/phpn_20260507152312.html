<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petualangan Katak Lompat</title>
    <style>
        :root {
            --river-blue: #4FC3F7;
            --grass-green: #8BC34A;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #222;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Area Permainan */
        #game-stage {
            width: 900px;
            height: 500px;
            background: linear-gradient(to bottom, var(--grass-green) 0%, var(--grass-green) 15%, var(--river-blue) 15%, var(--river-blue) 85%, var(--grass-green) 85%);
            position: relative;
            overflow: hidden;
            border: 8px solid #333;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        /* Batu-Batu */
        .stone {
            width: 100px;
            height: 60px;
            background: #78909c;
            border-radius: 50%;
            position: absolute;
            box-shadow: inset -5px -10px 15px rgba(0,0,0,0.4), 0 5px 10px rgba(0,0,0,0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.2s;
        }

        /* Posisi Batu di Sungai */
        .stone[data-id="0"] { bottom: 30px; left: 50px; width: 140px; height: 80px; } /* Start */
        .stone[data-id="1"] { bottom: 150px; left: 220px; }
        .stone[data-id="2"] { bottom: 280px; left: 380px; }
        .stone[data-id="3"] { bottom: 160px; left: 550px; }
        .stone[data-id="4"] { bottom: 250px; left: 730px; width: 140px; height: 80px; } /* Finish */

        /* Karakter Katak (Lengkap dengan tangan/kaki via CSS) */
        #frog {
            width: 60px;
            height: 50px;
            position: absolute;
            z-index: 100;
            transition: all 0.5s cubic-bezier(0.47, 0, 0.745, 0.715);
            cursor: pointer;
        }

        .frog-body {
            width: 100%;
            height: 100%;
            background: #4CAF50;
            border-radius: 50% 50% 40% 40%;
            position: relative;
        }

        /* Mata */
        .eye {
            width: 15px;
            height: 15px;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: -5px;
        }
        .eye.left { left: 10px; }
        .eye.right { right: 10px; }
        .pupil {
            width: 7px;
            height: 7px;
            background: black;
            border-radius: 50%;
            margin: 4px;
        }

        /* Tangan & Kaki */
        .limb {
            width: 15px;
            height: 25px;
            background: #388E3C;
            position: absolute;
            border-radius: 10px;
        }
        .arm-l { top: 20px; left: -10px; transform: rotate(-30deg); }
        .arm-r { top: 20px; right: -10px; transform: rotate(30deg); }
        .leg-l { bottom: -5px; left: 0px; transform: rotate(-20deg); }
        .leg-r { bottom: -5px; right: 0px; transform: rotate(20deg); }

        /* Pop-up Modal */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 25px;
            text-align: center;
            max-width: 450px;
            border: 8px solid #4CAF50;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .img-container {
            width: 100%;
            height: 250px;
            background: url('https://images.unsplash.com/photo-1591873095034-77114677764d?q=80&w=600') center/cover;
            border-radius: 15px;
            margin-bottom: 15px;
        }

        .btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 1.2rem;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 5px 0 #2E7D32;
        }

        .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #2E7D32; }

        .hint {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 1.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="game-stage">
        <div class="hint">Klik Katak untuk Melompat! 🐸</div>
        
        <!-- Batu -->
        <div class="stone" data-id="0"></div>
        <div class="stone" data-id="1"></div>
        <div class="stone" data-id="2"></div>
        <div class="stone" data-id="3"></div>
        <div class="stone" data-id="4"></div>

        <!-- Katak dengan Detail Tubuh -->
        <div id="frog">
            <div class="limb arm-l"></div>
            <div class="limb arm-r"></div>
            <div class="limb leg-l"></div>
            <div class="limb leg-r"></div>
            <div class="frog-body">
                <div class="eye left"><div class="pupil"></div></div>
                <div class="eye right"><div class="pupil"></div></div>
            </div>
        </div>
    </div>

    <!-- Pop-up -->
    <div class="modal" id="winModal">
        <div class="modal-content">
            <div class="img-container"></div>
            <h2>HORE! BERHASIL! 🐸✨</h2>
            <p>Katak cantikmu sudah sampai di seberang sungai dengan selamat!</p>
            <button class="btn" onclick="resetGame()">Main Lagi</button>
        </div>
    </div>

    <script>
        const frog = document.getElementById('frog');
        const modal = document.getElementById('winModal');
        const stones = document.querySelectorAll('.stone');
        
        let currentStone = 0;
        let isMoving = false;

        // Set posisi awal katak di atas batu pertama
        function updateFrogPosition() {
            const stone = document.querySelector(`.stone[data-id="${currentStone}"]`);
            const rect = stone.getBoundingClientRect();
            const stageRect = document.getElementById('game-stage').getBoundingClientRect();

            // Hitung posisi tengah batu
            const x = stone.offsetLeft + (stone.offsetWidth / 2) - (frog.offsetWidth / 2);
            const y = stone.offsetTop + (stone.offsetHeight / 2) - (frog.offsetHeight / 1.5);

            frog.style.left = x + 'px';
            frog.style.top = y + 'px';
        }

        // Jalankan saat pertama kali buka
        window.onload = updateFrogPosition;

        // Fungsi melompat
        frog.addEventListener('click', () => {
            if (isMoving || currentStone >= 4) return;

            isMoving = true;
            currentStone++;

            // Efek visual lompatan (naik sedikit lalu turun)
            frog.style.transform = "scale(1.3) translateY(-40px)";
            
            setTimeout(() => {
                updateFrogPosition();
                frog.style.transform = "scale(1) translateY(0)";
                
                setTimeout(() => {
                    isMoving = false;
                    // Jika sampai di batu terakhir
                    if (currentStone === 4) {
                        setTimeout(() => {
                            modal.style.display = 'flex';
                        }, 500);
                    }
                }, 500);
            }, 200);
        });

        function resetGame() {
            currentStone = 0;
            updateFrogPosition();
            modal.style.display = 'none';
            isMoving = false;
        }

        // Responsif jika layar diubah ukurannya
        window.onresize = updateFrogPosition;
    </script>
</body>
</html>
