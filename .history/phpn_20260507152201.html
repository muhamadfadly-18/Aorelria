<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katak Melompat di Sungai</title>
    <style>
        /* --- CSS: Mengatur Tampilan Elemen --- */
        
        body {
            margin: 0;
            padding: 0;
            overflow: hidden; /* Mencegah scroll */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            /* Latar belakang sungai kartun */
            background-image: url('https://img.freepik.com/premium-vector/cartoon-landscape-river-forest_29937-2954.jpg');
            background-size: cover;
            background-position: center;
        }

        /* Container utama game */
        #game-container {
            width: 100%;
            height: 100%;
            position: relative;
            cursor: pointer;
        }

        /* Katak Kartun yang bisa diklik */
        #cartoon-frog {
            width: 100px; /* Sesuaikan ukuran */
            position: absolute;
            bottom: 10%;
            left: 10%;
            transition: all 0.5s ease-out; /* Efek lompat halus */
            z-index: 10;
        }

        /* Batu-batu sungai kartun */
        .stone {
            width: 80px;
            height: 40px;
            background-color: #78909c;
            border-radius: 50%;
            position: absolute;
            box-shadow: inset -5px -5px 10px rgba(0,0,0,0.3);
        }

        #stone1 { bottom: 8%; left: 8%; width: 140px; height: 70px; } /* Batu awal */
        #stone2 { bottom: 20%; left: 30%; }
        #stone3 { bottom: 15%; left: 50%; }
        #stone4 { bottom: 25%; left: 70%; }
        #stone5 { bottom: 10%; left: 85%; width: 120px; height: 60px;} /* Batu akhir */

        /* --- CSS: Mengatur Pop-up (Modal) --- */
        
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7); /* Latar belakang gelap */
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0; /* Sembunyikan default */
            visibility: hidden;
            transition: opacity 0.3s ease;
            z-index: 100;
        }

        /* Class untuk menampilkan modal */
        .modal-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background-color: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            max-width: 400px;
            width: 90%;
            transform: scale(0.7); /* Efek zoom out saat sembunyi */
            transition: transform 0.3s ease;
            border: 5px solid #4caf50; /* Border hijau */
        }

        .modal-overlay.show .modal-content {
            transform: scale(1); /* Efek zoom in saat muncul */
        }

        /* Foto katak asli di dalam pop-up */
        #popup-photo {
            width: 100%;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .modal-content h2 {
            margin: 0 0 10px 0;
            color: #2e7d32;
            font-size: 24px;
        }

        .modal-content p {
            margin: 0 0 20px 0;
            color: #555;
            font-size: 16px;
        }

        /* Tombol di dalam pop-up */
        .modal-btn {
            background-color: #4caf50;
            color: white;
            border: none;
            padding: 10px 25px;
            font-size: 18px;
            border-radius: 25px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .modal-btn:hover {
            background-color: #388e3c;
        }

        /* Petunjuk klik di bawah */
        #click-hint {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 18px;
            text-shadow: 1px 1px 2px black;
            z-index: 5;
        }

    </style>
</head>
<body>

    <!-- Area Game Utama -->
    <div id="game-container">
        
        <!-- Batu-batu -->
        <div class="stone" id="stone1"></div>
        <div class="stone" id="stone2"></div>
        <div class="stone" id="stone3"></div>
        <div class="stone" id="stone4"></div>
        <div class="stone" id="stone5"></div>

        <!-- Katak Kartun (Gambar placeholder) -->
        <img src="https://raw.githubusercontent.com/Tarikul-Islam-Anik/Animated-Fluent-Emojis/master/Emojis/Animals/Frog.png" id="cartoon-frog" alt="Katak Kartun">

        <div id="click-hint">Klik untuk Lanjut</div>
    </div>

    <!-- Pop-up Modal (Sembunyi secara default) -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <!-- Foto Katak Asli (Gambar placeholder) -->
            <img src="https://images.unsplash.com/photo-1591873095034-77114677764d?q=80&w=600&auto=format&fit=crop" id="popup-photo" alt="Foto Katak Asli">
            
            <h2>HORE! KATAK SAMPAI! 🐸</h2>
            <p>Katak sudah berhasil melompat ke batu dengan aman.</p>
            <button class="modal-btn" id="resetBtn">Lompat Lagi!</button>
        </div>
    </div>

    <script>
        // --- JavaScript: Mengatur Logika Interaksi ---
        
        const gameContainer = document.getElementById('game-container');
        const frog = document.getElementById('cartoon-frog');
        const modal = document.getElementById('modalOverlay');
        const resetBtn = document.getElementById('resetBtn');

        // Koordinat tujuan lompatan (batu akhir #stone5)
        const targetX = "85%";
        const targetY = "10%"; // bottom: 10%

        let isJumping = false; // Status apakah katak sedang melompat

        // Fungsi untuk menangani klik pada area game
        gameContainer.addEventListener('click', function(event) {
            // Jika pop-up sedang muncul atau katak sedang melompat, abaikan klik
            if (modal.classList.contains('show') || isJumping) return;

            isJumping = true;

            // Efek Lompat: Mengubah posisi katak menggunakan CSS transition
            frog.style.left = targetX;
            frog.style.bottom = targetY;
            frog.style.transform = "scale(1.2) rotate(10deg)"; // Sedikit membesar dan miring saat melompat

            // Tunggu sampai animasi lompat selesai (0.5 detik), lalu munculkan pop-up
            setTimeout(function() {
                frog.style.transform = "scale(1) rotate(0deg)"; // Kembalikan ukuran normal
                showPopup();
            }, 500); 
        });

        // Fungsi untuk menampilkan pop-up
        function showPopup() {
            modal.classList.add('show');
        }

        // Fungsi untuk mereset katak dan menutup pop-up
        function resetGame() {
            modal.classList.remove('show');
            // Kembalikan katak ke posisi awal
            frog.style.left = "10%";
            frog.style.bottom = "10%";
            isJumping = false;
        }

        // Event listener untuk tombol "Lompat Lagi!"
        resetBtn.addEventListener('click', function(event) {
            event.stopPropagation(); // Mencegah klik tombol memicu klik game-container
            resetGame();
        });

    </script>
</body>
</html>
