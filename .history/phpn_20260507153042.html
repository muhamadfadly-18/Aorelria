<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katak Petualang Galeri</title>
    <style>
        :root {
            --water: #00b4d8;
            --grass: #7bc043;
            --frog-green: #4caf50;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #2c3e50;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
        }

        /* Arena Utama */
        #river-stage {
            width: 900px;
            height: 500px;
            background: linear-gradient(to bottom, #95e1d3 0%, var(--water) 20%, var(--water) 80%, #95e1d3 100%);
            position: relative;
            border-radius: 30px;
            border: 10px solid #ecf0f1;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }

        /* Batu Estetik */
        .stone {
            width: 110px;
            height: 70px;
            background: radial-gradient(circle at 30% 30%, #bdc3c7, #7f8c8d);
            border-radius: 50%;
            position: absolute;
            box-shadow: 0 10px 0 #2c3e50, 0 15px 20px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: 0.3s;
        }

        .stone:hover { transform: scale(1.05); }

        /* Posisi Batu Sesuai Alur */
        .stone[data-step="0"] { bottom: 40px; left: 50px; }
        .stone[data-step="1"] { bottom: 180px; left: 200px; }
        .stone[data-step="2"] { bottom: 120px; left: 380px; }
        .stone[data-step="3"] { bottom: 250px; left: 550px; }
        .stone[data-step="4"] { bottom: 150px; left: 730px; }

        /* Katak Detail (Tangan & Kaki) */
        #frog {
            width: 70px;
            height: 60px;
            position: absolute;
            z-index: 10;
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
        }

        .frog-body {
            width: 100%;
            height: 100%;
            background: var(--frog-green);
            border-radius: 50% 50% 40% 40%;
            position: relative;
            border: 2px solid #2e7d32;
        }

        .eye { width: 18px; height: 18px; background: white; border-radius: 50%; position: absolute; top: -8px; border: 1px solid #000;}
        .eye.l { left: 12px; } .eye.r { right: 12px; }
        .pupil { width: 8px; height: 8px; background: black; border-radius: 50%; margin: 5px; }

        .limb { width: 12px; height: 25px; background: #388e3c; position: absolute; border-radius: 10px; transition: 0.3s; }
        .arm-l { top: 25px; left: -8px; transform: rotate(-40deg); }
        .arm-r { top: 25px; right: -8px; transform: rotate(40deg); }
        .leg-l { bottom: -5px; left: 5px; transform: rotate(-20deg); }
        .leg-r { bottom: -5px; right: 5px; transform: rotate(20deg); }

        /* Animasi Lompat */
        .jumping .arm-l { transform: rotate(-100deg) translateY(-10px); }
        .jumping .arm-r { transform: rotate(100deg) translateY(-10px); }

        /* Pop-up Modal */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
            transform: translateY(50px);
            opacity: 0;
            transition: 0.4s;
            border: 6px solid var(--frog-green);
        }

        .modal.active { display: flex; }
        .modal.active .modal-content { transform: translateY(0); opacity: 1; }

        .modal-img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 15px;
            margin-bottom: 15px;
            background: #eee;
        }

        .btn-next {
            background: var(--frog-green);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 #2e7d32;
        }

        .btn-next:hover { background: #45a049; }
    </style>
</head>
<body>

    <div id="river-stage">
        <!-- Batu -->
        <div class="stone" data-step="0"></div>
        <div class="stone" data-step="1"></div>
        <div class="stone" data-step="2"></div>
        <div class="stone" data-step="3"></div>
        <div class="stone" data-step="4"></div>

        <!-- Katak -->
        <div id="frog">
            <div class="limb arm-l"></div>
            <div class="limb arm-r"></div>
            <div class="limb leg-l"></div>
            <div class="limb leg-r"></div>
            <div class="frog-body">
                <div class="eye l"><div class="pupil"></div></div>
                <div class="eye r"><div class="pupil"></div></div>
            </div>
        </div>
    </div>

    <!-- Modal Dinamis -->
    <div class="modal" id="popup">
        <div class="modal-content">
            <img src="" class="modal-img" id="pop-img">
            <h2 id="pop-title">Judul</h2>
            <p id="pop-text">Deskripsi</p>
            <button class="btn-next" onclick="closePopup()">Lanjut Melompat!</button>
        </div>
    </div>

    <script>
        const frog = document.getElementById('frog');
        const popup = document.getElementById('popup');
        const stones = document.querySelectorAll('.stone');
        
        let currentStep = 0;
        let isMoving = false;

        // Data konten untuk setiap batu
        const content = [
            { title: "Batu Pertama!", text: "Perjalanan dimulai dari sini. Siap melompat?", img: "https://images.unsplash.com/photo-1590005024862-6b67679a29fb?w=400" },
            { title: "Indahnya Sungai", text: "Wah, airnya sangat jernih ya!", img: "https://images.unsplash.com/photo-1518020382113-a7e8fc38eac9?w=400" },
            { title: "Teman Baru", text: "Lihat sekeliling, banyak bunga bermekaran.", img: "https://images.unsplash.com/photo-1551009175-15bdf9dcb580?w=400" },
            { title: "Hampir Sampai", text: "Sedikit lagi sampai di seberang!", img: "https://images.unsplash.com/photo-1437622368342-7a3d73a34c8f?w=400" },
            { title: "Yeay, Berhasil!", text: "Terima kasih sudah membantuku menyeberang!", img: "https://images.unsplash.com/photo-1591873095034-77114677764d?w=400" }
        ];

        function jumpTo(step) {
            if (isMoving) return;
            isMoving = true;
            
            const targetStone = document.querySelector(`.stone[data-step="${step}"]`);
            
            // Animasi visual katak melompat
            frog.classList.add('jumping');
            
            // Gerakan ke koordinat batu
            const x = targetStone.offsetLeft + (targetStone.offsetWidth/2) - 35;
            const y = targetStone.offsetTop + (targetStone.offsetHeight/2) - 45;
            
            frog.style.left = x + 'px';
            frog.style.top = y + 'px';
            frog.style.transform = "scale(1.4) translateY(-30px)";

            setTimeout(() => {
                frog.classList.remove('jumping');
                frog.style.transform = "scale(1) translateY(0)";
                
                // Munculkan Pop-up setelah mendarat
                setTimeout(() => {
                    openPopup(step);
                }, 300);
            }, 600);
        }

        function openPopup(step) {
            document.getElementById('pop-img').src = content[step].img;
            document.getElementById('pop-title').innerText = content[step].title;
            document.getElementById('pop-text').innerText = content[step].text;
            popup.classList.add('active');
        }

        function closePopup() {
            popup.classList.remove('active');
            isMoving = false;
            
            // Jika sudah sampai batu terakhir, beri opsi reset
            if(currentStep === 4) {
                setTimeout(() => {
                    alert("Selamat! Kamu sudah menyelesaikan petualangan.");
                    currentStep = -1; // Reset
                }, 500);
            }
            
            // Jika diklik, maju ke langkah berikutnya
            if(currentStep < 4) {
                currentStep++;
                // Kita beri jeda sedikit sebelum otomatis lompat lagi jika diinginkan
                // Atau user bisa klik batunya sendiri.
            }
        }

        // Jalankan awal
        window.onload = () => jumpTo(0);

        // Tambahkan event klik pada setiap batu agar interaktif
        stones.forEach(stone => {
            stone.addEventListener('click', () => {
                const step = parseInt(stone.getAttribute('data-step'));
                if(step === currentStep + 1 || step === 0) { // Hanya bisa lompat ke batu berikutnya
                    currentStep = step;
                    jumpTo(step);
                }
            });
        });
    </script>
</body>
</html>
