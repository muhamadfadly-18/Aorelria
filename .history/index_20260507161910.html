<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Untuk Kamu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Marhey:wght@400;700&family=Nunito:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <audio id="bgMusic" loop autoplay preload="auto">
      <source src="assets/music/Kiss the Rain.mp3" type="audio/mp3" />
    </audio>

    <section class="intro-screen" id="introScreen">
      <div class="intro-screen__rain" aria-hidden="true" id="rainLayer"></div>
      <div class="intro-screen__mist"></div>
      <div class="intro-screen__content">
        <div class="intro-screen__countdown" id="countdownText">5</div>
        <button
          class="primary-button intro-screen__button hidden"
          id="beginBtn"
          type="button"
        >
          Mulai Cerita
        </button>
      </div>
    </section>

    <div class="loading-screen hidden" id="loadingScreen">
      <div class="loading-screen__stars"></div>
      <div class="loading-screen__content">
        <div class="loading-screen__moon"></div>
        <p class="loading-screen__eyebrow" id="loadingLabel">
          moonlight loading
        </p>
        <h1 class="loading-screen__title" id="loadingTitle">
          Loading Love Story
        </h1>
        <div class="loading-screen__bar">
          <div class="loading-screen__fill" id="loadingFill"></div>
        </div>
      </div>
    </div>

    <section class="montage-section hidden" id="montageSection">
      <div class="montage-section__bg"></div>
      <div
        class="montage-section__rain"
        aria-hidden="true"
        id="montageRain"
      ></div>
      <div class="montage-shell">
        <div class="montage-orb montage-orb--left"></div>
        <div class="montage-orb montage-orb--right"></div>
        <div class="montage-track" id="montageTrack"></div>
      </div>
    </section>

    <section class="game-section hidden" id="gameSection">
      <div class="game-section__bg"></div>
      <div class="game-panel">
        <p class="game-panel__eyebrow">mini game cinta</p>
        <h2 class="game-panel__title">Tembak Hati Dengan Lembut</h2>
        <p class="game-panel__text">
          Kumpulkan 10 hati. Panel ini dibuat kecil di atas supaya panggungnya
          tetap bersih.
        </p>
        <div class="game-panel__score">Score <span id="score">0</span>/10</div>
      </div>

      <div class="archer-stage">
        <div class="hearts-container" id="heartsContainer"></div>
        <div class="arrow-layer" id="arrowLayer"></div>
        <div class="archer-bow" aria-hidden="true">
          <div class="archer-bow__glow"></div>
          <div class="archer-bow__body"></div>
          <div class="archer-bow__string"></div>
          <div class="archer-bow__arrow"></div>
        </div>
      </div>
    </section>

    <section class="calculator-section hidden" id="calculatorSection">
      <canvas id="starCanvas"></canvas>
      <div class="calculator-stars"></div>

      <div class="cute-calculator">
        <div class="calculator-top">
          <div class="calculator-hearts">♡ ♡ ♡</div>

          <div class="calculator-screen" id="calculatorScreen">0</div>
        </div>

        <div class="calculator-buttons">
          <button class="calc-btn">1</button>
          <button class="calc-btn">2</button>
          <button class="calc-btn">3</button>
          <button class="calc-btn">4</button>
          <button class="calc-btn">5</button>
          <button class="calc-btn">6</button>
          <button class="calc-btn">7</button>
          <button class="calc-btn">8</button>
          <button class="calc-btn">9</button>

          <button class="calc-btn calc-clear">C</button>
          <button class="calc-btn">0</button>
          <button class="calc-btn calc-love">♡</button>
        </div>
      </div>

      <div class="memory-popup hidden" id="memoryPopup">
        <canvas id="popupStars"></canvas>
        <div class="memory-popup__card">
          <div class="memory-book">
            <div class="memory-book__left">
              <div class="memory-book__content">
                <span class="memory-book__chapter"> chapter memories </span>

                <h2 id="popupTitle">Kamu Lucu Banget 🌙</h2>

                <p id="popupText">
                  Bahkan angka 1 aja jadi spesial karena ngingetin aku sama
                  kamu.
                </p>

                <button id="closePopup">tutup cerita ♡</button>
              </div>
            </div>

            <div class="memory-book__right">
              <img src="assets/images/memory-photo-01.jpeg" id="popupImage" />
            </div>
          </div>
        </div>
      </div>
    </section>

    <script src="script.js"></script>
    <div class="cursor-glow" id="cursorGlow"></div>
  </body>
</html>
