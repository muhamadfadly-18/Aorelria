<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pohon Animasi</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      overflow:hidden;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:flex-end;
      background:linear-gradient(to top,#7ec850,#b8ecff);
      font-family:Arial, Helvetica, sans-serif;
    }

    .scene{
      position:relative;
      width:100%;
      height:100vh;
    }

    /* Matahari */
    .sun{
      position:absolute;
      top:70px;
      right:100px;
      width:120px;
      height:120px;
      border-radius:50%;
      background:#ffd54a;
      box-shadow:0 0 50px #ffd54a;
      animation:sunGlow 3s infinite alternate;
    }

    @keyframes sunGlow{
      from{
        transform:scale(1);
      }
      to{
        transform:scale(1.08);
      }
    }

    /* Tanah */
    .ground{
      position:absolute;
      bottom:0;
      width:100%;
      height:180px;
      background:#4e9b3d;
    }

    /* Pohon */
    .tree{
      position:absolute;
      bottom:150px;
      left:50%;
      transform:translateX(-50%);
    }

    /* Batang */
    .trunk{
      width:70px;
      height:280px;
      background:#6b3f1d;
      margin:auto;
      border-radius:20px;
      position:relative;
      box-shadow:inset -8px 0 0 rgba(0,0,0,0.15);
    }

    /* Ranting utama */
    .branch{
      position:absolute;
      background:#6b3f1d;
      border-radius:20px;
      transform-origin:bottom;
    }

    .branch1{
      width:22px;
      height:140px;
      left:-40px;
      top:40px;
      transform:rotate(-45deg);
    }

    .branch2{
      width:22px;
      height:150px;
      right:-40px;
      top:30px;
      transform:rotate(45deg);
    }

    .branch3{
      width:18px;
      height:100px;
      left:-25px;
      top:130px;
      transform:rotate(-65deg);
    }

    .branch4{
      width:18px;
      height:110px;
      right:-25px;
      top:120px;
      transform:rotate(65deg);
    }

    /* Daun */
    .leaf{
      position:absolute;
      width:180px;
      height:180px;
      background:#2f9e44;
      border-radius:50%;
      box-shadow:inset -10px -10px 0 rgba(0,0,0,0.08);
      animation:moveLeaf 4s ease-in-out infinite alternate;
    }

    .leaf1{
      top:-120px;
      left:-60px;
    }

    .leaf2{
      top:-90px;
      left:-130px;
    }

    .leaf3{
      top:-90px;
      right:-130px;
    }

    .leaf4{
      top:-150px;
      left:-5px;
    }

    .leaf5{
      top:-20px;
      left:-120px;
    }

    .leaf6{
      top:-20px;
      right:-120px;
    }

    @keyframes moveLeaf{
      from{
        transform:rotate(-2deg);
      }
      to{
        transform:rotate(2deg);
      }
    }

    /* Buah */
    .fruit{
      position:absolute;
      width:30px;
      height:30px;
      border-radius:50%;
      background:red;
      box-shadow:0 0 10px rgba(255,0,0,0.5);
      animation:fruitSwing 2s ease-in-out infinite alternate;
    }

    .fruit::before{
      content:"";
      position:absolute;
      width:3px;
      height:15px;
      background:#3f2a14;
      left:50%;
      top:-12px;
      transform:translateX(-50%);
    }

    .fruit1{
      top:20px;
      left:-40px;
    }

    .fruit2{
      top:-10px;
      right:-40px;
    }

    .fruit3{
      top:80px;
      left:60px;
    }

    .fruit4{
      top:120px;
      right:40px;
    }

    .fruit5{
      top:-50px;
      left:40px;
    }

    @keyframes fruitSwing{
      from{
        transform:rotate(-4deg);
      }
      to{
        transform:rotate(4deg);
      }
    }

    /* Rumput */
    .grass{
      position:absolute;
      bottom:150px;
      width:100%;
      height:30px;
      background:repeating-linear-gradient(
        -45deg,
        #4caf50,
        #4caf50 10px,
        #43a047 10px,
        #43a047 20px
      );
    }

    /* Awan */
    .cloud{
      position:absolute;
      width:140px;
      height:60px;
      background:white;
      border-radius:50px;
      opacity:0.9;
      animation:cloudMove 30s linear infinite;
    }

    .cloud::before,
    .cloud::after{
      content:"";
      position:absolute;
      background:white;
      border-radius:50%;
    }

    .cloud::before{
      width:70px;
      height:70px;
      top:-30px;
      left:20px;
    }

    .cloud::after{
      width:90px;
      height:90px;
      top:-40px;
      right:15px;
    }

    .cloud1{
      top:80px;
      left:-200px;
    }

    .cloud2{
      top:180px;
      left:-300px;
      transform:scale(0.8);
      animation-duration:40s;
    }

    @keyframes cloudMove{
      from{
        transform:translateX(0);
      }
      to{
        transform:translateX(140vw);
      }
    }

    .title{
      position:absolute;
      top:20px;
      width:100%;
      text-align:center;
      font-size:40px;
      color:#2d572c;
      font-weight:bold;
      text-shadow:2px 2px 5px rgba(255,255,255,0.7);
    }
  </style>
</head>

<body>

  <div class="scene">

    <div class="title">🌳 Pohon Buah Animasi 🌳</div>

    <div class="sun"></div>

    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>

    <div class="tree">

      <div class="trunk">

        <div class="branch branch1"></div>
        <div class="branch branch2"></div>
        <div class="branch branch3"></div>
        <div class="branch branch4"></div>

      </div>

      <!-- Daun -->
      <div class="leaf leaf1"></div>
      <div class="leaf leaf2"></div>
      <div class="leaf leaf3"></div>
      <div class="leaf leaf4"></div>
      <div class="leaf leaf5"></div>
      <div class="leaf leaf6"></div>

      <!-- Buah -->
      <div class="fruit fruit1"></div>
      <div class="fruit fruit2"></div>
      <div class="fruit fruit3"></div>
      <div class="fruit fruit4"></div>
      <div class="fruit fruit5"></div>

    </div>

    <div class="grass"></div>
    <div class="ground"></div>

  </div>

  <script>
    // Efek buah jatuh saat diklik
    const fruits = document.querySelectorAll(".fruit");

    fruits.forEach(fruit => {
      fruit.addEventListener("click", () => {

        fruit.style.transition = "1.5s";
        fruit.style.transform = "translateY(500px) rotate(360deg)";
        fruit.style.opacity = "0";

        setTimeout(() => {
          fruit.remove();
        }, 1500);

      });
    });
  </script>

</body>
</html>
