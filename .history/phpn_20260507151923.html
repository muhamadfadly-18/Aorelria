<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pohon Interaktif Canvas</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: linear-gradient(to bottom, #87CEEB, #E0F6FF);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            background-color: transparent;
        }
        .controls {
            position: absolute;
            bottom: 20px;
            font-family: sans-serif;
            background: rgba(255, 255, 255, 0.7);
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.3s;
        }
        .controls:hover {
            background: rgba(255, 255, 255, 1);
        }
    </style>
</head>
<body>

    <canvas id="treeCanvas"></canvas>
    <div class="controls" onclick="generateTree()">Klik untuk Tanam Pohon Baru</div>

    <script>
        const canvas = document.getElementById('treeCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        function drawTree(startX, startY, len, angle, branchWidth) {
            ctx.beginPath();
            ctx.save();
            ctx.strokeStyle = "#4B2C20"; // Warna dahan (cokelat tua)
            ctx.fillStyle = "#FF4D4D";   // Warna buah (merah)
            ctx.lineWidth = branchWidth;
            ctx.translate(startX, startY);
            ctx.rotate(angle * Math.PI / 180);
            ctx.moveTo(0, 0);
            ctx.lineTo(0, -len);
            ctx.stroke();

            // Jika dahan sudah cukup kecil, buat buah
            if (len < 15) {
                ctx.beginPath();
                ctx.arc(0, -len, 5, 0, Math.PI * 2); // Gambar buah bulat
                ctx.fill();
                ctx.restore();
                return;
            }

            // Rekursi untuk membuat dahan baru (kiri dan kanan)
            // Parameter: (X baru, Y baru, panjang berkurang, sudut berubah, lebar dahan menipis)
            drawTree(0, -len, len * 0.75, angle - 20, branchWidth * 0.7);
            drawTree(0, -len, len * 0.75, angle + 20, branchWidth * 0.7);

            ctx.restore();
        }

        function generateTree() {
            // Bersihkan canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Titik awal (tengah bawah)
            const centerX = canvas.width / 2;
            const bottomY = canvas.height - 50;
            
            // Panggil fungsi utama: drawTree(x, y, panjang, sudut, lebar)
            drawTree(centerX, bottomY, 120, 0, 15);
        }

        // Gambar pertama kali saat load
        generateTree();

        // Resizing canvas jika jendela berubah
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            generateTree();
        });
    </script>
</body>
</html>
